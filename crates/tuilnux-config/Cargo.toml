[package]
name = "tuilnux-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gemeinsame TUILNUX-Einstellungen (~/.config/tuilnux/tuilnux.toml) und daraus erzeugte Dateien für labwc, GTK und die Sitzung"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }
dirs = "7.0.0"
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
