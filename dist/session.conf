# /etc/tuilnux/session.conf – systemweite Voreinstellung für tuilnux-session.
# Pro Benutzer überschreibbar in ~/.config/tuilnux/session.conf.
#
# TUILNUX_BACKEND:
#   auto   labwc, sonst cage, sonst Linux-Konsole
#   labwc  Vollbild-Terminal als Desktop unter labwc; grafische Programme (Firefox,
#          Discord …) öffnen sich darüber als verschiebbare Fenster
#   cage   Vollbild-Terminal im Wayland-Kiosk cage (keine Fenster für GUI-Programme)
#   tty    immer direkt auf der Linux-Konsole
TUILNUX_BACKEND=auto

# Terminal für labwc/cage (leer = foot, kitty, alacritty in dieser Reihenfolge)
TUILNUX_TERMINAL=

# Schrift und Größe für foot, z. B. "DejaVu Sans Mono:size=12"
TUILNUX_FONT=monospace:size=10
